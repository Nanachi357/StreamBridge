name: Native FFmpeg build and compatibility

on:
  push:
    paths: ['native/ffmpeg/**', 'backend/**', '.gitattributes', '.github/workflows/native-ffmpeg.yml']
  pull_request:
    paths: ['native/ffmpeg/**', 'backend/**', '.gitattributes', '.github/workflows/native-ffmpeg.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ffmpeg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test source acquisition without network
        shell: pwsh
        run: ./native/ffmpeg/Test-SourceDownload.ps1
      - name: Download and verify pinned FFmpeg source
        shell: pwsh
        run: ./native/ffmpeg/Get-Source.ps1 -DestinationDirectory "$env:RUNNER_TEMP/ffmpeg-bundle/sources"
      - name: Build Windows tools with the pinned recipe
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/ffmpeg-bundle"
          docker build --platform linux/amd64 --tag streambridge-ffmpeg-ci native/ffmpeg
          docker run --rm --platform linux/amd64 --network none \
            --mount "type=bind,source=$PWD/native/ffmpeg,target=/recipe,readonly" \
            --mount "type=bind,source=$output,target=/out" streambridge-ffmpeg-ci
      - name: Verify complete materials and negative controls
        shell: pwsh
        run: ./native/ffmpeg/Test-Materials.ps1 -BundleDirectory "$env:RUNNER_TEMP/ffmpeg-bundle"
      - name: Archive runtime together with matching materials
        shell: bash
        run: tar -czf "$RUNNER_TEMP/ffmpeg-bundle.tar.gz" -C "$RUNNER_TEMP/ffmpeg-bundle" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ffmpeg-bundle.tar.gz
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/ffmpeg-artifact
      - name: Verify bundle before executing native tools
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'ffmpeg-bundle'
          New-Item -ItemType Directory -Path $bundle | Out-Null
          tar -xzf "$env:RUNNER_TEMP/ffmpeg-artifact/ffmpeg-bundle.tar.gz" -C $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Bundle extraction failed' }
          ./native/ffmpeg/Test-Materials.ps1 -BundleDirectory $bundle
          "STREAMBRIDGE_FFMPEG_DIR=$bundle/runtime" >> $env:GITHUB_ENV
          'STREAMBRIDGE_MINIMAL_FFMPEG_CHECK=1' >> $env:GITHUB_ENV
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/streambridge-jdk-cache
        with:
          distribution: temurin
          java-version: '21.0.13+9.0.LTS'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install separate fixture generator
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'fixture-tools.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw 'Fixture checksum mismatch' }
          $tools = Join-Path $env:RUNNER_TEMP 'fixture-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          "STREAMBRIDGE_FIXTURE_FFMPEG_DIR=$tools/ffmpeg-9.0.2-essentials_build/bin" >> $env:GITHUB_ENV
      - name: Exercise candidate and media integration
        run: .\backend\gradlew.bat -p backend clean test --tests '*MinimalFfmpegTest' --tests '*HlsPreviewTest' --tests '*RealHlsSampleProbeTest' --tests '*FfmpegTransferTest'
      - name: Require all six candidate cases and no skipped tests
        run: |
          $ErrorActionPreference = 'Stop'
          $reports = @(Get-ChildItem backend/build/test-results/test -Filter 'TEST-*.xml')
          if ($reports.Count -ne 4) { throw 'Expected four media suites' }
          $candidate = 0
          foreach ($report in $reports) {
            [xml]$xml = Get-Content -LiteralPath $report.FullName -Raw
            $suite = $xml.testsuite
            if ([int]$suite.skipped -ne 0 -or [int]$suite.errors -ne 0 -or [int]$suite.failures -ne 0) { throw "Incomplete media suite: $($suite.name)" }
            if ($suite.name -eq 'dev.streambridge.spike.MinimalFfmpegTest') { $candidate = [int]$suite.tests }
          }
          if ($candidate -ne 6) { throw 'Expected all six minimal FFmpeg cases' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ffmpeg-test-results-${{ github.sha }}
          path: backend/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14
